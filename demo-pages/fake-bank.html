<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State Bank of India - Net Banking Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 Arial, sans-serif; background: #eef4fb; color: #12355b; }
    header { background: #1c4f9c; color: #fff; padding: 16px 28px; font-size: 20px; font-weight: 700; }
    main { max-width: 420px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 6px; border: 1px solid #cddbee; }
    h1 { font-size: 20px; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-weight: 700; }
    input { width: 100%; padding: 10px; border: 1px solid #9db4d3; border-radius: 4px; font-size: 15px; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 4px; background: #1c4f9c; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .note { margin-top: 16px; font-size: 13px; color: #4b6584; }
  </style>
</head>
<body>
  <header>State Bank of India</header>
  <main>
    <h1>Net Banking login</h1>
    <p>Your KYC update is pending. Verify immediately to avoid your account being blocked.</p>
    <form onsubmit="return false">
      <label for="u">Username</label>
      <input id="u" type="text" autocomplete="off" />
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="off" />
      <button type="submit">Login</button>
    </form>
    <p class="note">This is a demo page for testing. It does not send your input anywhere.</p>
  </main>
</body>
</html>
